<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 64" fill="none" role="img" aria-label="NSW Albania - National Single Window">
  <title>NSW Albania - National Single Window</title>

  <!-- ============ SHIELD ICON ============ -->
  <path d="M8 2 L44 2 Q51 2 51 9 L51 38 L27 58 L3 38 L3 9 Q3 2 10 2 Z" fill="white" opacity="0.95"/>
  <path d="M3 41 L51 41 L27 58 Z" fill="#C8102E"/>
  <path d="M8 2 L44 2 Q51 2 51 9 L51 38 L27 58 L3 38 L3 9 Q3 2 10 2 Z"
        fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

  <!-- Agency nodes -->
  <circle cx="12"  cy="17" r="3.5" fill="#5C1A6E"/>
  <circle cx="27"  cy="11" r="3.5" fill="#5C1A6E"/>
  <circle cx="42"  cy="17" r="3.5" fill="#5C1A6E"/>

  <!-- Convergence lines -->
  <line x1="12" y1="20.5" x2="27" y2="37"
        stroke="rgba(92,26,110,0.55)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="27" y1="14.5" x2="27" y2="37"
        stroke="rgba(92,26,110,0.55)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="42" y1="20.5" x2="27" y2="37"
        stroke="rgba(92,26,110,0.55)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Central node -->
  <circle cx="27" cy="37" r="5.5" fill="#5C1A6E"/>
  <circle cx="27" cy="37" r="2.5" fill="white"/>

  <!-- NSW wordmark -->
  <text x="66" y="44"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="38" font-weight="900"
    fill="white" letter-spacing="-0.5">NSW</text>

  <line x1="66" y1="50" x2="156" y2="50" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <text x="67" y="61"
    font-family="Arial,'Helvetica Neue',sans-serif"
    font-size="10.5" font-weight="700"
    letter-spacing="4.2"
    fill="#F87171">ALBANIA</text>

  <!-- Vertical divider -->
  <line x1="167" y1="12" x2="167" y2="54"
        stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="178" y="33"
    font-family="Arial,'Helvetica Neue',sans-serif"
    font-size="9.5" fill="rgba(255,255,255,0.70)">National Single Window</text>

  <text x="178" y="48"
    font-family="Arial,'Helvetica Neue',sans-serif"
    font-size="9" font-style="italic"
    fill="rgba(255,255,255,0.50)">Dritarja Kombëtare e Vetme</text>
</svg>
